[tox]
envlist = py{39,314}-driver-{sqliteXerial, hsqldb, mock, postgres, mysql, mssql, trino, oracle, db2, drill}

[gh-actions]
python =
  3.9: py39-driver-{hsqldb, sqliteXerial, mock, postgres, mysql}
  3.14: py314-driver-{hsqldb, sqliteXerial, mock, postgres, mysql}

[testenv]
# usedevelop required to enable coveralls source code view.
usedevelop=True
passenv = JY_*,JAVA_HOME,JAVA8_DRIVERS
allowlist_externals = mvn, mkdir, bash
setenv =
  CLASSPATH = {tox_root}/test/jars/*:{tox_root}/test/mock-jars/*
  driver-mock: TESTNAME=test_mock test_infrastructure
  driver-hsqldb: TESTNAME=test_hsqldb
  driver-sqliteXerial: TESTNAME=test_sqlite.SqliteXerialTest
  driver-sqlitePy: TESTNAME=test_sqlite.SqlitePyTest
  driver-postgres: TESTNAME=test_postgres
  driver-mysql: TESTNAME=test_mysql
  driver-mssql: TESTNAME=test_mssql
  driver-trino: TESTNAME=test_trino
  driver-oracle: TESTNAME=test_oracle
  driver-db2: TESTNAME=test_db2
  driver-drill: TESTNAME=test_drill
deps =
  JPype1>=1.0.0
  coverage>=4.5
  pyarrow>=16.0.0
  numpy
  unittest-xml-reporting
commands =
  python --version
  bash test/build.sh
  bash test/download_jdbc_drivers.sh {env:JAVA8_DRIVERS:}
  driver-mock: mvn compile assembly:single -f mockdriver/pom.xml
  driver-mock: bash -c 'cp {tox_root}/mockdriver/target/mockdriver*.jar {tox_root}/test/mock-jars/'
;  {posargs:coverage run -a --source jaydebeapi test/testsuite.py {env:TESTNAME}}
  python test/testsuite.py -x -s {envname} {env:TESTNAME}
