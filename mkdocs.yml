site_name: JayDeBeApiArrow
site_description: High-performance JDBC to Python DB-API bridge, accelerated with Apache Arrow
site_url: https://henrynebula.github.io/jaydebeapiarrow/
repo_url: https://github.com/HenryNebula/jaydebeapiarrow
repo_name: HenryNebula/jaydebeapiarrow

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Design: design.md
  - Usage: usage.md
  - Data Mapping: data-mapping.md
  - Benchmarks: benchmarks.md
  - Differences: differences.md
